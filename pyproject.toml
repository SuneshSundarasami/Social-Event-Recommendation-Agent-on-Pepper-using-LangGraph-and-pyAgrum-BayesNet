[project]
name = "social-event-agent"
version = "0.1.0"
description = "Socially interactive event recommendation agent for the Pepper robot (qiBullet)."
readme = "README.md"
# Pinned to 3.8 for NAOqi / qiBullet compatibility (robot side).
# The WP2 dialogue manager (LangGraph, >=3.9) runs as a separate service.
requires-python = ">=3.8,<3.9"
dependencies = [
    # WP1 — perception (contrib build: adds cv2.face for WP1 face verification)
    "opencv-contrib-python>=4.5,<4.9",
    "numpy<1.25",
    "qibullet>=1.4.3",
    "pybullet>=3.2.7",
    # WP3 — Bayesian recommender
    "pyagrum>=1.13.2",
    # WP4 — behaviour layer (speech + threaded gesture coordination)
    "pyttsx3>=2.99",          # offline TTS fallback
    "edge-tts>=6.1",          # neural TTS voice (natural prosody)
    "playsound==1.2.2",       # audio playback for neural TTS
    "threadpool>=1.3.2",
    # WP4 — event tablet image (workshop.avif / food.avif need AVIF decode
    # support; pinned to 1.4.6, the last version with a cp38-win_amd64 wheel).
    "pillow-avif-plugin==1.4.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# Standalone project — not a member of the parent HCICR workspace.
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
