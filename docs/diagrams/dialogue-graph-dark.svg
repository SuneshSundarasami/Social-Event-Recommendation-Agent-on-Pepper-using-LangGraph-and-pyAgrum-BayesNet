<text x="906.5" y="196.0" font-size="12.0" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">contradiction?</text>
<text x="906.5" y="212.3" font-size="12.0" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">re-open the slot</text>
