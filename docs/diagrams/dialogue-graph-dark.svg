<text x="1120.0" y="196.0" font-size="12.0" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">commit, rephrase</text>
<text x="1120.0" y="212.3" font-size="12.0" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">or apply default</text>
