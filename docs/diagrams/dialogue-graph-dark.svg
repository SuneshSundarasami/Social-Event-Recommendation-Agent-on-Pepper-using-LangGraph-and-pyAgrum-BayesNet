<text x="457.0" y="179.9" font-size="14.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">QuestionFramer</text>
<text x="457.0" y="196.0" font-size="12.0" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">LLM writes one open</text>
<text x="457.0" y="212.3" font-size="12.0" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">question · robot asks</text>
<rect x="598.0" y="148.0" width="170.0" height="86.0" rx="12.0" fill="url(#g-green)" stroke="#2A8427" stroke-width="1.2" filter="url(#shadow)"/>
<text x="683.0" y="179.9" font-size="14.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">AnswerParser</text>
<text x="683.0" y="196.0" font-size="12.0" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">abuse filter → LLM</text>
<text x="683.0" y="212.3" font-size="12.0" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">→ whitelist → guard</text>
