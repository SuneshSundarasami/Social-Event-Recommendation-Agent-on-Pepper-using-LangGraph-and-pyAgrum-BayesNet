<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="436" viewBox="0 0 1240 436" font-family="Arial, Helvetica, sans-serif">
<title>Dialogue manager. A LangGraph StateGraph (dialogue/graph.py) that runs inside the FSM&#x27;s Conversation state and fills the six preference slots</title>
