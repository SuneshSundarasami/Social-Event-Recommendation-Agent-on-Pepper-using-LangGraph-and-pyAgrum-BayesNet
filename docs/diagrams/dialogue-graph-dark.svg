<text x="241.0" y="179.9" font-size="14.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Router</text>
<text x="241.0" y="196.0" font-size="12.0" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">pick a random</text>
<text x="241.0" y="212.3" font-size="12.0" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">unfilled slot</text>
