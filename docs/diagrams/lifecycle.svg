<rect x="80.0" y="80.0" width="220.0" height="104.0" rx="12.0" fill="url(#g-grey)" stroke="#676D73" stroke-width="1.2" filter="url(#shadow)"/>
<text x="190.0" y="120.8" font-size="16.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Idle</text>
<text x="190.0" y="137.8" font-size="12.5" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">watches the camera until</text>
<text x="190.0" y="154.8" font-size="12.5" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">a face is stable</text>
<circle cx="84.0" cy="84.0" r="13.0" fill="#7D838A" stroke="#FFFFFE" stroke-width="2"/>
<text x="84.0" y="88.0" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<rect x="390.0" y="80.0" width="220.0" height="104.0" rx="12.0" fill="url(#g-blue)" stroke="#024F8A" stroke-width="1.2" filter="url(#shadow)"/>
<text x="500.0" y="120.8" font-size="16.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Greeting</text>
<text x="500.0" y="137.8" font-size="12.5" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">verifies the face (or asks consent)</text>
<text x="500.0" y="154.8" font-size="12.5" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">wave → nod → open arms</text>
<circle cx="394.0" cy="84.0" r="13.0" fill="#0262AB" stroke="#FFFFFE" stroke-width="2"/>
<text x="394.0" y="88.0" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<rect x="700.0" y="80.0" width="220.0" height="104.0" rx="12.0" fill="url(#g-green)" stroke="#2A8427" stroke-width="1.2" filter="url(#shadow)"/>
<text x="810.0" y="120.8" font-size="16.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Conversation</text>
<text x="810.0" y="137.8" font-size="12.5" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">LangGraph asks open questions</text>
<text x="810.0" y="154.8" font-size="12.5" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">with a short &#x27;talk&#x27; gesture</text>
<circle cx="704.0" cy="84.0" r="13.0" fill="#369F32" stroke="#FFFFFE" stroke-width="2"/>
<text x="704.0" y="88.0" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<rect x="700.0" y="276.0" width="220.0" height="104.0" rx="12.0" fill="url(#g-darkgreen)" stroke="#146339" stroke-width="1.2" filter="url(#shadow)"/>
<text x="810.0" y="316.8" font-size="16.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Reasoning</text>
<text x="810.0" y="333.8" font-size="12.5" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">thinking pose while the</text>
<text x="810.0" y="350.8" font-size="12.5" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">Bayesian network ranks events</text>
<circle cx="704.0" cy="280.0" r="13.0" fill="#1A7B47" stroke="#FFFFFE" stroke-width="2"/>
<text x="704.0" y="284.0" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<rect x="390.0" y="276.0" width="220.0" height="104.0" rx="12.0" fill="url(#g-blue)" stroke="#024F8A" stroke-width="1.2" filter="url(#shadow)"/>
<text x="500.0" y="316.8" font-size="16.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Recommendation</text>
<text x="500.0" y="333.8" font-size="12.5" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">top 3 events, tablet image</text>
<text x="500.0" y="350.8" font-size="12.5" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">and a spoken explanation</text>
<circle cx="394.0" cy="280.0" r="13.0" fill="#0262AB" stroke="#FFFFFE" stroke-width="2"/>
<text x="394.0" y="284.0" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
<rect x="80.0" y="276.0" width="220.0" height="104.0" rx="12.0" fill="url(#g-navy)" stroke="#061C2E" stroke-width="1.2" filter="url(#shadow)"/>
<text x="190.0" y="316.8" font-size="16.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Farewell</text>
<text x="190.0" y="333.8" font-size="12.5" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">goodbye wave, tablet cleared,</text>
<text x="190.0" y="350.8" font-size="12.5" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">state reset</text>
<circle cx="84.0" cy="280.0" r="13.0" fill="#0A2A43" stroke="#FFFFFE" stroke-width="2"/>
<text x="84.0" y="284.0" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text>
<circle cx="30.0" cy="132.0" r="7" fill="#1F2328"/>
<path d="M34.0,132.0 L80.0,132.0" fill="none" stroke="#1F2328" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-1F2328)"/>
<path d="M300.0,132.0 L390.0,132.0" fill="none" stroke="#1F2328" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-1F2328)"/>
<text x="345.0" y="122.0" font-size="12.0" fill="#1F2328" text-anchor="middle" stroke="#FFFFFE" stroke-width="4" stroke-linejoin="round" paint-order="stroke">face stable</text>
<text x="345.0" y="154.0" font-size="11.0" fill="#5A6270" text-anchor="middle">4 of 5 frames</text>
<path d="M610.0,132.0 L700.0,132.0" fill="none" stroke="#1F2328" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-1F2328)"/>
<text x="655.0" y="122.0" font-size="12.0" fill="#1F2328" text-anchor="middle" stroke="#FFFFFE" stroke-width="4" stroke-linejoin="round" paint-order="stroke">still present</text>
<path d="M810.0,184.0 L810.0,276.0" fill="none" stroke="#1F2328" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-1F2328)"/>
<text x="822.0" y="234.0" font-size="12.0" fill="#1F2328" text-anchor="start" stroke="#FFFFFE" stroke-width="4" stroke-linejoin="round" paint-order="stroke">evidence collected</text>
<path d="M700.0,328.0 L610.0,328.0" fill="none" stroke="#1F2328" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-1F2328)"/>
<text x="655.0" y="318.0" font-size="12.0" fill="#1F2328" text-anchor="middle" stroke="#FFFFFE" stroke-width="4" stroke-linejoin="round" paint-order="stroke">events ranked</text>
<path d="M390.0,328.0 L300.0,328.0" fill="none" stroke="#1F2328" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-1F2328)"/>
<text x="345.0" y="318.0" font-size="12.0" fill="#1F2328" text-anchor="middle" stroke="#FFFFFE" stroke-width="4" stroke-linejoin="round" paint-order="stroke">acknowledged</text>
<text x="345.0" y="350.0" font-size="11.0" fill="#5A6270" text-anchor="middle">or timeout</text>
<path d="M190.0,276.0 L190.0,184.0" fill="none" stroke="#1E8449" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-1E8449)"/>
<text x="202.0" y="234.0" font-size="12.0" fill="#1E8449" text-anchor="start" stroke="#FFFFFE" stroke-width="4" stroke-linejoin="round" paint-order="stroke">next visitor</text>
<path d="M460.0,80.0 L460.0,70.0 Q460.0,60.0 450.0,60.0 L224.0,60.0 Q214.0,60.0 214.0,70.0 L214.0,80.0" fill="none" stroke="#C62828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m-C62828)"/>
<path d="M810.0,80.0 L810.0,54.0 Q810.0,42.0 798.0,42.0 L178.0,42.0 Q166.0,42.0 166.0,54.0 L166.0,80.0" fill="none" stroke="#C62828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m-C62828)"/>
<text x="500.0" y="34.0" font-size="12.0" fill="#C62828" text-anchor="middle" font-style="italic" stroke="#FFFFFE" stroke-width="4" stroke-linejoin="round" paint-order="stroke">visitor walked away → back to Idle</text>
