<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="416" viewBox="0 0 1000 416" font-family="Arial, Helvetica, sans-serif">
<title>Interaction lifecycle. One encounter, from the first stable face to the goodbye; the robot returns to Idle whenever the visitor walks away</title>
