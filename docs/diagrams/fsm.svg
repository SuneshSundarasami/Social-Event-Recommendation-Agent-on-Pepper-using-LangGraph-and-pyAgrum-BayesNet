<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="526" viewBox="0 0 1000 526" font-family="Arial, Helvetica, sans-serif">
<title>InteractionFSM in detail. Each state handler returns the next state; the code names on the arrows are the checks that drive each transition</title>
