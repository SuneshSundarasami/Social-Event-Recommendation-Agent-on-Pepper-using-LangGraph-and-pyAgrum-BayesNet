<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="326" viewBox="0 0 1000 326" font-family="Arial, Helvetica, sans-serif">
<title>Voice. TTS_BACKEND picks the speech engine; lines are spoken on a worker thread so gestures can run at the same time</title>
