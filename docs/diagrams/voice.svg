<text x="285.0" y="60.0" font-size="11.5" fill="#1F2328" text-anchor="middle" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" stroke="#FFFFFE" stroke-width="4" stroke-linejoin="round" paint-order="stroke">auto · edge</text>
<path d="M177.2,140.0 L228.0,140.0 Q240.0,140.0 240.0,152.0 L240.0,168.0 Q240.0,180.0 252.0,180.0 L330.0,180.0" fill="none" stroke="#1F2328" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-1F2328)"/>
<text x="285.0" y="172.0" font-size="11.5" fill="#1F2328" text-anchor="middle" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" stroke="#FFFFFE" stroke-width="4" stroke-linejoin="round" paint-order="stroke">pyttsx3</text>
<path d="M177.2,140.0 L228.0,140.0 Q240.0,140.0 240.0,152.0 L240.0,260.0 Q240.0,272.0 252.0,272.0 L330.0,272.0" fill="none" stroke="#1F2328" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-1F2328)"/>
<text x="285.0" y="264.0" font-size="11.5" fill="#1F2328" text-anchor="middle" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" stroke="#FFFFFE" stroke-width="4" stroke-linejoin="round" paint-order="stroke">none</text>
<path d="M505.0,108.0 L505.0,148.0" fill="none" stroke="#C62828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m-C62828)"/>
<text x="493.0" y="132.0" font-size="11.5" fill="#C62828" text-anchor="end" font-style="italic" stroke="#FFFFFE" stroke-width="4" stroke-linejoin="round" paint-order="stroke">offline or failing → this line falls back</text>
<rect x="700.0" y="86.0" width="270.0" height="98.0" rx="12.0" fill="url(#g-navy)" stroke="#061C2E" stroke-width="1.2" filter="url(#shadow)"/>
<text x="835.0" y="116.1" font-size="15.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">TtsEngine</text>
<text x="835.0" y="132.0" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-style="italic" fill-opacity="0.90">worker thread</text>
<text x="835.0" y="148.2" font-size="12.0" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">queues each line, speaks it,</text>
<text x="835.0" y="164.6" font-size="12.0" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">signals when it has finished</text>
