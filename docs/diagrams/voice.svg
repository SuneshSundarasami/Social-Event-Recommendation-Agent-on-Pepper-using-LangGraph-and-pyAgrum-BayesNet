<rect x="58.8" y="120.0" width="118.5" height="40.0" rx="20.0" fill="url(#g-navy)" stroke="#061C2E" stroke-width="1.2" filter="url(#shadow)"/>
<text x="118.0" y="144.9" font-size="13.5" fill="#FFFFFF" text-anchor="middle" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-weight="bold">TTS_BACKEND</text>
<rect x="330.0" y="28.0" width="230.0" height="80.0" rx="12.0" fill="url(#g-blue)" stroke="#024F8A" stroke-width="1.2" filter="url(#shadow)"/>
<text x="445.0" y="56.7" font-size="14.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">edge-tts neural voice</text>
<text x="445.0" y="72.7" font-size="12.0" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">en-GB-RyanNeural</text>
<text x="445.0" y="89.0" font-size="12.0" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">rate −8% · pitch −5 Hz</text>
<rect x="330.0" y="148.0" width="230.0" height="64.0" rx="12.0" fill="url(#g-steel)" stroke="#375C85" stroke-width="1.2" filter="url(#shadow)"/>
<text x="445.0" y="176.9" font-size="14.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">pyttsx3</text>
<text x="445.0" y="192.9" font-size="12.0" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">offline SAPI5 / eSpeak</text>
<rect x="330.0" y="246.0" width="230.0" height="52.0" rx="12.0" fill="url(#g-grey)" stroke="#676D73" stroke-width="1.2" filter="url(#shadow)"/>
<text x="445.0" y="269.2" font-size="14.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">silent</text>
<text x="445.0" y="284.7" font-size="11.5" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">text printed only</text>
