<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="386" viewBox="0 0 1020 386" font-family="Arial, Helvetica, sans-serif">
<title>Face verification and consent-based enrollment. Runs at the start of the Greeting state whenever a camera is in use</title>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.18"/></filter><linearGradient id="g-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A4468"/><stop offset="1" stop-color="#0A2A43"/></linearGradient><linearGradient id="g-amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7C04A"/><stop offset="1" stop-color="#EDA923"/></linearGradient><linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EE5243"/><stop offset="1" stop-color="#D93A2B"/></linearGradient><linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4BB847"/><stop offset="1" stop-color="#369F32"/></linearGradient><marker id="m-1F2328" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1.5 L11,6 L1,10.5 L3.5,6 z" fill="#1F2328"/></marker><marker id="m-1E8449" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1.5 L11,6 L1,10.5 L3.5,6 z" fill="#1E8449"/></marker><marker id="m-C98A0C" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1.5 L11,6 L1,10.5 L3.5,6 z" fill="#C98A0C"/></marker></defs>
<rect x="244.0" y="80.0" width="556.0" height="256.0" rx="18.0" fill="#FFF8E6" stroke="#EBC567" stroke-width="1.8"/>
<rect x="20.5" y="129.0" width="103.0" height="34.0" rx="17.0" fill="url(#g-navy)" stroke="#061C2E" stroke-width="1.2" filter="url(#shadow)"/>
<text x="72.0" y="150.7" font-size="13.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">stable face</text>
<polygon points="180.0,105.0 232.0,146.0 180.0,187.0 128.0,146.0" fill="url(#g-amber)" stroke="#C98A0C" stroke-width="1.2" stroke-linejoin="round" filter="url(#shadow)"/>
<text x="180.0" y="142.0" font-size="12.5" fill="#3A2A00" text-anchor="middle">known</text>
<text x="180.0" y="159.0" font-size="12.5" fill="#3A2A00" text-anchor="middle">face?</text>
<path d="M288.0,114.0 H446.0 Q458.0,114.0 458.0,126.0 V160.0 Q458.0,172.0 446.0,172.0 H310.0 L302.0,183.0 L298.0,172.0 H288.0 Q276.0,172.0 276.0,160.0 V126.0 Q276.0,114.0 288.0,114.0 Z" fill="#FFFFFD" stroke="#D0D5DB" stroke-width="1.6" stroke-linejoin="round" filter="url(#shadow)"/>
<text x="367.0" y="139.2" font-size="12.0" fill="#1F2328" text-anchor="middle">I don&#x27;t think we&#x27;ve met yet.</text>
<text x="367.0" y="155.5" font-size="12.0" fill="#1F2328" text-anchor="middle">What&#x27;s your name?</text>
<path d="M486.0,114.0 H658.0 Q670.0,114.0 670.0,126.0 V160.0 Q670.0,172.0 658.0,172.0 H508.0 L500.0,183.0 L496.0,172.0 H486.0 Q474.0,172.0 474.0,160.0 V126.0 Q474.0,114.0 486.0,114.0 Z" fill="#FFFFFD" stroke="#D0D5DB" stroke-width="1.6" stroke-linejoin="round" filter="url(#shadow)"/>
<text x="572.0" y="139.2" font-size="12.0" fill="#1F2328" text-anchor="middle">Would it be okay if I</text>
<text x="572.0" y="155.5" font-size="12.0" fill="#1F2328" text-anchor="middle">remember your face?</text>
<polygon points="730.0,105.0 782.0,146.0 730.0,187.0 678.0,146.0" fill="url(#g-amber)" stroke="#C98A0C" stroke-width="1.2" stroke-linejoin="round" filter="url(#shadow)"/>
<text x="730.0" y="150.5" font-size="12.5" fill="#3A2A00" text-anchor="middle">yes?</text>
<rect x="812.0" y="110.0" width="178.0" height="72.0" rx="12.0" fill="url(#g-red)" stroke="#B8301F" stroke-width="1.2" filter="url(#shadow)"/>
<text x="901.0" y="135.2" font-size="13.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Capture ~15 samples</text>
<text x="901.0" y="150.6" font-size="11.5" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">from the open camera feed</text>
<text x="901.0" y="166.2" font-size="11.5" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">then retrain() at once</text>
<rect x="560.0" y="248.0" width="180.0" height="68.0" rx="12.0" fill="url(#g-amber)" stroke="#C98A0C" stroke-width="1.2" filter="url(#shadow)"/>
<text x="650.0" y="271.2" font-size="13.5" fill="#3A2A00" text-anchor="middle" font-weight="bold">Nothing captured</text>
<text x="650.0" y="286.6" font-size="11.5" fill="#3A2A00" text-anchor="middle">&quot;No problem, {name}.&quot;</text>
<text x="650.0" y="302.2" font-size="11.5" fill="#3A2A00" text-anchor="middle">name used this time only</text>
<rect x="812.0" y="246.0" width="178.0" height="72.0" rx="12.0" fill="url(#g-green)" stroke="#2A8427" stroke-width="1.2" filter="url(#shadow)"/>
<text x="901.0" y="271.2" font-size="13.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Greetings, {name}.</text>
<text x="901.0" y="286.6" font-size="11.5" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">personal greeting, then</text>
<text x="901.0" y="302.2" font-size="11.5" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.95">wave → nod → open arms</text>
<path d="M123.5,146.0 L128.0,146.0" fill="none" stroke="#1F2328" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-1F2328)"/>
<path d="M232.0,146.0 L276.0,143.0" fill="none" stroke="#1F2328" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-1F2328)"/>
<text x="254.0" y="138.0" font-size="11.5" fill="#1F2328" text-anchor="middle" stroke="#FFFFFE" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text>
<path d="M458.0,143.0 L474.0,143.0" fill="none" stroke="#1F2328" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-1F2328)"/>
<path d="M670.0,143.0 L678.0,146.0" fill="none" stroke="#1F2328" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-1F2328)"/>
<path d="M782.0,146.0 L812.0,146.0" fill="none" stroke="#1E8449" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-1E8449)"/>
<text x="797.0" y="138.0" font-size="11.5" fill="#1E8449" text-anchor="middle" stroke="#FFFFFE" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text>
<path d="M730.0,187.0 L730.0,248.0" fill="none" stroke="#C98A0C" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-C98A0C)"/>
<text x="744.0" y="216.0" font-size="11.5" fill="#C98A0C" text-anchor="start" stroke="#FFFFFE" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text>
<path d="M901.0,182.0 L901.0,246.0" fill="none" stroke="#1E8449" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-1E8449)"/>
<path d="M740.0,282.0 L812.0,282.0" fill="none" stroke="#1F2328" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-1F2328)"/>
<path d="M180.0,105.0 L180.0,58.0 Q180.0,46.0 192.0,46.0 L992.0,46.0 Q1004.0,46.0 1004.0,58.0 L1004.0,275.0 Q1004.0,282.0 997.0,282.0 L990.0,282.0" fill="none" stroke="#1E8449" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-1E8449)"/>
<text x="600.0" y="38.0" font-size="12.0" fill="#1E8449" text-anchor="middle" stroke="#FFFFFE" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes · recognised by LBPH (distance ≤ 75) → greet by name, no questions</text>
<text x="272.0" y="276.0" font-size="14.0" fill="#8A5A00" text-anchor="start" font-weight="bold">Consent gate</text>
<text x="272.0" y="296.0" font-size="12.0" fill="#5A6270" text-anchor="start">face samples are stored only</text>
<text x="272.0" y="313.0" font-size="12.0" fill="#5A6270" text-anchor="start">after an explicit yes</text>
<text x="30.0" y="362.0" font-size="12.0" fill="#5A6270" text-anchor="start" font-style="italic">No camera wired (--source scripted) or no name given → generic &quot;Greetings.&quot; without enrollment.</text>
</svg>
